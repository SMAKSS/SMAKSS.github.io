name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          HASHNODE_HOST: ${{ vars.HASHNODE_HOST }}
          NPM_MAINTAINER: ${{ vars.NPM_MAINTAINER }}
          STACKOVERFLOW_USER_ID: ${{ vars.STACKOVERFLOW_USER_ID }}
          GH_USERNAME: ${{ vars.GH_USERNAME }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: pnpm build
